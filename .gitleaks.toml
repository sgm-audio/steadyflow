# Gitleaks config for SteadyFlow
# Detects secrets, tokens, and keys in committed code.
# Run: gitleaks detect --config=.gitleaks.toml

title = "SteadyFlow Gitleaks Config"

[allowlist]
  description = "Allowed patterns"

  # Allow local dev Supabase keys (non-production, only localhost)
  [[allowlist.rules]]
    id = "generic-api-key"
    description = "Local Supabase dev keys"
    regexes = [
      '''sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH''',
    ]

  # Allow test fixture UUIDs
  [[allowlist.rules]]
    id = "generic-api-key"
    description = "Test fixture UUIDs"
    regexes = [
      '''11111111-1111-1111-1111-111111111111''',
      '''22222222-2222-2222-2222-222222222222''',
    ]
