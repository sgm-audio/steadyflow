<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SteadyFlow</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <!-- Auth State -->
    <div id="auth-section">
      <div id="login-form" class="hidden">
        <h2>Sign In</h2>
        <form id="login">
          <input type="email" id="email" placeholder="Email" required />
          <input type="password" id="password" placeholder="Password" required />
          <button type="submit">Sign In</button>
        </form>
        <p id="login-error" class="error hidden"></p>
      </div>

      <div id="authenticated-section" class="hidden">
        <div id="user-info">
          <span id="user-email"></span>
          <button id="logout-btn" class="small">Sign Out</button>
        </div>

        <div id="page-info">
          <h3>Current Page</h3>
          <p id="page-title" class="truncate">Loading...</p>
          <p id="page-url" class="truncate subtle"></p>
          <div id="page-meta" class="hidden">
            <span id="product-count"></span>
            <span id="page-desc" class="subtle"></span>
          </div>
        </div>

        <button id="analyze-btn" class="primary">
          Analyze This Shop
        </button>

        <div id="result-section" class="hidden">
          <p id="result-text"></p>
          <a id="view-dashboard" href="#" target="_blank">View in Dashboard →</a>
        </div>
      </div>
    </div>

    <footer>
      <a href="#" id="dashboard-link" target="_blank">Open Dashboard</a>
    </footer>
  </div>
  <script type="module" src="popup.ts"></script>
</body>
</html>
